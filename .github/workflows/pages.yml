# Build the site and publish it to https://agentltl.github.io.
# Reference pages come from the repositories they document (scripts/pull.py), so the site is
# rebuilt when one of them changes (their docs.yml sends a `docs` event, with the
# DOCS_DISPATCH_TOKEN organization secret), every night in case one was missed, and by hand
# (Actions → Pages → Run workflow).
name: Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: {repository: AgentLTL/AgentLTL, path: _sources/AgentLTL}
      - uses: actions/checkout@v5
        with: {repository: AgentLTL/cli-to-tools, path: _sources/cli-to-tools}
      - uses: actions/checkout@v5
        with: {repository: AgentLTL/agentltl-claude-code, path: _sources/agentltl-claude-code}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt ./_sources/cli-to-tools
      - run: python scripts/pull.py
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with: {path: site}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
